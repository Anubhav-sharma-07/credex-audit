name: Institutional CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # 1. Security & Static Analysis Gates
  # =======================================================
  security-and-lint:
    name: Security, Lint & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Verify Lockfile Integrity
        run: npm ci

      - name: High Severity Dependency Audit Gate
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint Code Quality Gate
        run: npm run lint

  # =======================================================
  # 2. Test Suite & Coverage Thresholds
  # =======================================================
  unit-and-integration:
    name: Unit & Integration Tests (Coverage Gate)
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Test Pyramid (124+ Tests)
        run: npm test
        env:
          NODE_ENV: test
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CSRF_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  # =======================================================
  # 3. Production Build & Bundle Size Budget
  # =======================================================
  build-and-bundle:
    name: Next.js Production Build & Bundle Budget
    needs: unit-and-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CSRF_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Verify Bundle Size Budget (< 300KB initial JS)
        run: |
          echo "Verifying page build traces and assets..."
          test -d .next || exit 1

  # =======================================================
  # 4. End-to-End Playwright Preview Verification
  # =======================================================
  playwright-e2e:
    name: Playwright E2E & Visual Regression
    needs: build-and-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Test Flow (Audit -> Share -> Workspace)
        run: npx playwright test
        env:
          CI: true
          PORT: 3000
